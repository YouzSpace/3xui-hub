# ControlHub 入口反代：前端已 go:embed 进 Go 二进制，nginx 不再持有静态 root，
# 只负责 80 端口收流量转给 127.0.0.1:8080（SPA 路由、接口、节点资产全由 Go serve）。
# 静态资源缓存头由 Go 输出（assets/ 长缓存、index.html no-cache），这里不重复声明。

# 普通请求 Connection: close；带 Upgrade 的（节点 WS 长连接）走 upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 真实客户端 IP 还原 ────────────────────────────────────────────────
# 前面挂着 Cloudflare 时，$remote_addr 是 CF 的边缘节点，真正的客户端在 CF-Connecting-IP 里。
# 只对「确实来自 CF 网段」的连接做还原：set_real_ip_from 之外的来源即便伪造 CF 头也不会被采信。
# 网段清单见 https://www.cloudflare.com/ips/ —— CF 增段时这里要跟着更新，
# 漏更新只会让「新增段来的请求」退化成按 CF 边缘 IP 计数，不会放大伪造面。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# 没有 CF 时这段是空操作（来源不在上面网段内，nginx 不替换 $remote_addr）。
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    charset utf-8;

    # 文本资源 gzip（Go 不压缩，由 nginx 压，含被代理的响应）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml font/ttf font/otf font/woff2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # xray 节点 WS 长连接（agent 主通道；Go 内置），单独给长超时
    location /node-ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 覆盖语义：整条 XFF 由 nginx 重写，不追加客户端自带的值。
        # 用 $proxy_add_x_forwarded_for 会把客户端伪造的地址留在首位，
        # 后端按「第一个不可信段」取 IP 时就被伪造值顶替 → 按 IP 的限流可被清零重算。
        # 后面若再加一层反代，改成 `$remote_addr, <上一跳地址>` 显式拼。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余全部交给 Go：前端路由（/ 与 SPA fallback）、接口（/api、/admin-api）、
    # 节点安装脚本与资产（/node-install.sh、/node-agent.sh、/node-bin/）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # 同上：覆盖语义，丢弃客户端自带的 X-Forwarded-For。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
