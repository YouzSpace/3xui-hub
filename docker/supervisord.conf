; ControlHub Supervisor 配置（Go 后端：MySQL + Nginx + controlhub 单进程）
; Go 单进程内置 scheduler 与节点 WS，不需要 PHP-FPM / cron / queue worker

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mysql]
command=/usr/sbin/mysqld --user=mysql
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:controlhub]
command=/var/www/html/server/controlhub-server
directory=/var/www/html/server
environment=CONFIG_ENV="/var/www/html/.env",LISTEN_ADDR=":8080"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
