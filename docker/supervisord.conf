; ControlHub Supervisor 配置
; 管理 Nginx、PHP-FPM、MySQL、Cron 和队列 Worker

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mysql]
command=/usr/sbin/mysqld --user=mysql
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 默认队列 worker：只跑 default（定时任务类 Job），不要加 --queue
[program:queue-worker]
command=php artisan queue:work database --sleep=2 --tries=5 --timeout=120 --max-time=3600
directory=/var/www/html/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 节点任务专用队列 worker（node-ops）×2
; 为什么要第二条队列：一条 queue:work 一次只跑一个 Job，新建节点初始化那种
; 100+ Job 的批量任务会把封禁检查/健康检查的 Job 堵在 default 队列后面。
; --queue=node-ops 千万不能漏：漏了就是和上面的 queue-worker 抢同一条队列，
; 白占内存还看不出任何效果。容器里 worker 数要按宿主机的 CPU/内存调，
; 小机器建议只留 queue-node-1（详见 INSTALL.md「队列与并发」）。
[program:queue-node-1]
command=php artisan queue:work database --queue=node-ops --sleep=2 --tries=5 --timeout=120 --max-time=3600
directory=/var/www/html/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-node-2]
command=php artisan queue:work database --queue=node-ops --sleep=2 --tries=5 --timeout=120 --max-time=3600
directory=/var/www/html/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; xray 节点 WS 长连接服务（agent 主通道；nginx 反代 /node-ws → 127.0.0.1:8091）。
; Workerman 常驻进程；连不上时 agent 自动降级 HTTP 通道，故本进程挂了不影响面板核心功能。
[program:node-ws]
command=php artisan node:ws-serve
directory=/var/www/html/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
