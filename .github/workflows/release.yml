name: Release

# 打 tag（v*）或手动触发时，在 CI（大机器）上用 GoReleaser 编译 linux 多架构二进制并发布到
# GitHub Release。用户服务器只下载二进制、不编译，避免小服务器 go build OOM。
#
# 编译配置全在 .goreleaser.yaml（本文件只负责环境准备 + 触发 + 发布后的 manifest 回写）。
# 版本号：tag 名去 v 前缀（v2.0.0 → 2.0.0），由 GoReleaser 从 git tag 取，烙进 main.Version。
# agent 版本独立：从 assets/manifest.json 的 agent.version 读，不跟 tag 走——面板发版而
# agent 没变时，节点不重复升级。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: '要编译的 tag（必须 v 开头）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser 创建 Release 并上传产物
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # GoReleaser 要完整历史与 tag 来算版本号

      # 手动触发时 github.ref_name 是分支名，版本号必须来自输入的那个 tag
      - name: 校验 ref 是 v* tag
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          case "$REF" in
            v*) echo "OK：$REF" ;;
            *) echo "::error::只能对 v* tag 发版（当前 ref：$REF）"; exit 1 ;;
          esac

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            server/go.sum
            agent/go.sum

      # 前端由 .goreleaser.yaml 的 before.hooks 编译（npm ci && npm run build），
      # 这里只装 Node 并启用 npm 依赖缓存
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # agent 版本号从 manifest 读。hooks 是子进程，导出变量回传不到 goreleaser 进程，
      # 所以在 step 里读出来写进 GITHUB_ENV，由 .goreleaser.yaml 的 {{ .Env.AGENT_VERSION }} 用。
      - name: 读取 agent 版本（manifest 的 agent.version，不跟 tag）
        run: |
          AGENT_VER=$(python3 -c "import json;print(json.load(open('assets/manifest.json'))['agent']['version'])")
          echo "agent 版本：$AGENT_VER"
          echo "AGENT_VERSION=$AGENT_VER" >> "$GITHUB_ENV"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    name: 回写 agent manifest
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 回写 assets/manifest.json 需要 push
    steps:
      # tag 是游离头，回写必须 checkout 分支（沿用旧流程：写 main）
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 取版本号（tag 去 v 前缀）
        id: version
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: 下载 agent 产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern controlhub-agent-linux-64 --dir dist --clobber

      # 只更新 sha256/size/url，version 保持（本地只在 agent 源码真变时 bump）
      - name: 更新 manifest 的 agent 段
        run: |
          python3 - <<'PY'
          import hashlib, json
          tag = "${{ steps.version.outputs.version }}"
          fname = "controlhub-agent-linux-64"
          data = open(f"dist/{fname}", "rb").read()
          sha = hashlib.sha256(data).hexdigest()
          size = len(data)
          p = "assets/manifest.json"
          with open(p, encoding="utf-8") as f:
              m = json.load(f)
          ver = m["agent"]["version"]  # agent 版本保持（本地只在 agent 源码变时 bump）
          m["agent"] = {
              "version": ver,
              "assets": [{
                  "arch": "linux-64",
                  "file": fname,
                  "sha256": sha,
                  "size": size,
                  "url": f"https://github.com/YouzSpace/3xui-hub/releases/download/v{tag}/{fname}",
              }],
          }
          with open(p, "w", encoding="utf-8") as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"manifest agent 段已更新（version={ver}，sha256={sha[:16]}…）")
          PY

      - name: 回写 manifest 到仓库
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/manifest.json
          git commit -m "chore(release): agent manifest v${{ steps.version.outputs.version }}" || echo "manifest 无变化"
          git push
